name: CI

on:
  push:
    branches: [main, operator/standalone-staging]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: operator
          POSTGRES_USER: operator
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operator -d operator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://operator@localhost:5432/operator
      DATABASE_SSL: "false"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      OPERATOR_DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Source hygiene
        run: npm run check:source
      - name: Standalone publication script syntax
        run: bash -n scripts/publish-standalone.sh
      - name: Production configuration contract
        env:
          AUTH_SECRET: ci-production-auth-secret-with-more-than-thirty-two-characters
          NEXT_PUBLIC_SITE_URL: https://yumna.example
          OPERATOR_DEMO_MODE: "false"
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM_EMAIL: Yumna <yumna@example.invalid>
          CRON_SECRET: ci-cron-secret-value
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRICE_ASSISTANT: price_assistant
          STRIPE_PRICE_OPERATOR: price_operator
          STRIPE_PRICE_CONCIERGE: price_concierge
          GOOGLE_MAPS_API_KEY: google_maps_ci_placeholder
          PIPEDREAM_PROJECT_ID: pd_project_ci
          PIPEDREAM_CLIENT_ID: pd_client_ci
          PIPEDREAM_CLIENT_SECRET: pd_secret_ci
          BRAVE_SEARCH_API_KEY: brave_ci_placeholder
          VAPI_API_KEY: vapi_ci_placeholder
          VAPI_ASSISTANT_ID: vapi_assistant_ci
          VAPI_PHONE_NUMBER_ID: vapi_phone_ci
          VAPI_WEBHOOK_SECRET: vapi_webhook_ci_placeholder
          OPERATOR_ACTION_RUNNER_URL: https://actions.yumna.example
        run: npm run check:production
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate database
        run: npm run db:migrate
      - name: Seed database
        env:
          SEED_ADMIN_EMAIL: ci-admin@example.invalid
          SEED_ADMIN_PASSWORD: ci-only-password-value
          SEED_ORG_NAME: Yumna CI
          SEED_ORG_SLUG: yumna-ci
        run: npm run db:seed
      - name: Test
        run: npm test
      - name: Production build
        env:
          AUTH_SECRET: ci-only-auth-secret-value-with-more-than-thirty-two-characters
        run: npm run build
