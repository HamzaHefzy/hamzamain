services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: operator
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: operator
    ports:
      - "55432:5432"
    volumes:
      - operator_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator -d operator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  operator_postgres:
